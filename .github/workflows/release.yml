name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and install Slint 1.17.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $slintDir = "C:\Slint-cpp-1.17.1"
          $installer = "$env:RUNNER_TEMP\Slint-cpp-1.17.1.exe"

          Write-Host "Downloading Slint 1.17.1..."

          Invoke-WebRequest `
            -Uri "https://github.com/slint-ui/slint/releases/download/v1.17.1/Slint-cpp-1.17.1-win64-MSVC-AMD64.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "Slint installer was not downloaded."
          }

          Write-Host "Slint installer downloaded successfully."

          Write-Host "Installing Slint to $slintDir..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S", "/D=$slintDir" `
            -Wait `
            -PassThru

          Write-Host "Slint installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "Slint installer failed with exit code $($process.ExitCode)."
          }

          if (-not (Test-Path $slintDir)) {
            throw "Slint installation directory was not created."
          }

          Write-Host "Slint installation completed successfully."

      - name: Verify Slint installation
        shell: powershell
        run: |
          $slintDir = "C:\Slint-cpp-1.17.1"

          $requiredFiles = @(
            "$slintDir\bin\slint-compiler.exe",
            "$slintDir\lib\slint_cpp.dll.lib",
            "$slintDir\lib\slint_cpp.dll",
            "$slintDir\include"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required Slint file was not found: $file"
            }

            Write-Host "Found: $file"
          }

          Write-Host "Slint 1.17.1 installation verified successfully."

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build Release x64
        shell: powershell
        run: |
          msbuild "brawlhalla autododge.sln" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SlintDir="C:\Slint-cpp-1.17.1"