name: Build and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository data
        shell: pwsh
        run: |
          Get-ChildItem data -Filter *.json -Recurse | ForEach-Object {
            Get-Content -Raw -LiteralPath $_.FullName | ConvertFrom-Json | Out-Null
          }

      - name: Install Slint C++
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $slintDir = 'C:\Slint-cpp-1.17.1'
          $installer = "$env:RUNNER_TEMP\Slint-cpp-1.17.1.exe"
          Invoke-WebRequest 'https://github.com/slint-ui/slint/releases/download/v1.17.1/Slint-cpp-1.17.1-win64-MSVC-AMD64.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$slintDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Slint installation failed with exit code $($process.ExitCode)." }
          @("$slintDir\bin\slint-compiler.exe", "$slintDir\lib\slint_cpp.dll", "$slintDir\lib\slint_cpp.dll.lib") | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_)) { throw "Missing Slint component: $_" }
          }
          "SLINT_DIR=$slintDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Platform x64 -SlintDir $env:SLINT_DIR

      - name: Package runtime
        shell: pwsh
        run: |
          $binary = Get-ChildItem x64\Release -Filter *.exe -File | Select-Object -First 1
          if ($null -eq $binary) { throw 'Release executable was not produced.' }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "build-$env:GITHUB_RUN_NUMBER" }
          ./scripts/package_release.ps1 -BinaryPath $binary.FullName -SlintDir $env:SLINT_DIR -Version $version

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: BrawlhallaAutododge-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BrawlhallaAutododge-windows-x64
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.zip
